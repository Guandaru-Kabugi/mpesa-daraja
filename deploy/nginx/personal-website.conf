# Nginx site config. On the server this goes in /etc/nginx/sites-available/
# (see docs/DEPLOYMENT.md, step 4).
#
# Nginx is the only program the internet talks to. It forwards API requests to
# Spring Boot on 127.0.0.1:8082. Spring Security decides who may do what.
#
# NOTE: after `certbot --nginx`, the server's copy also contains the HTTPS lines certbot
# added (listen 443, ssl_certificate...). Don't overwrite it with this file: copy the
# location blocks you need into it instead.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mpesa-api.alexguandaru.dev;

    # Don't advertise the Nginx version in errors and headers
    server_tokens off;

    # all mpesa apis.
    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy-to-api.conf;
    }

    # Placeholder until the React site is deployed
    location / {
        default_type text/plain;
        return 200 "Coming soon.\n";
    }
}
