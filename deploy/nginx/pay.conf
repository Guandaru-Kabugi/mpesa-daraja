# Nginx site for the M-Pesa payment page. On the server: /etc/nginx/sites-available/pay.conf
#
#   pay.alexguandaru.dev/api/*  →  the mpesa Spring Boot app on 127.0.0.1:8082
#   pay.alexguandaru.dev/*      →  the built mpesa-pay page in /var/www/mpesa-pay
#
# Serving the page and its API on one domain makes every request same-origin: no CORS
# config needed in Spring, and the page's relative /api/... calls work unchanged.
# Safaricom's callback also arrives here: <PUBLIC_BASE_URL>/api/payments/callback.
#
# The domain deliberately avoids the word "mpesa": Daraja rejects callback URLs containing
# "mpesa" or "safaricom".
#
# Uses two snippets that must exist in /etc/nginx/snippets/ on the server:
#   proxy-to-api.conf          already there from the personal website (personalwebsitebackend repo)
#   pay-security-headers.conf  next to this file in the repo; copy it over
#
# NOTE: after `certbot --nginx`, the server's copy also contains the HTTPS lines certbot
# added (listen 443, ssl_certificate...). Don't overwrite it with this file: copy the
# location blocks you need into it instead.

# Rate limit for starting a payment (per client IP): each request makes a PIN prompt pop up
# on whatever phone number was typed in, so bots mustn't be able to spam people's phones.
# Zone names are global across ALL Nginx site files, so this one must not be "contact" or
# "login", which personal-website.conf already defines.
limit_req_zone $binary_remote_addr zone=stkpush:10m rate=3r/m;

server {
    # No default_server: personal-website.conf already has it, and a second one makes
    # `nginx -t` fail. Requests are matched to this block by server_name instead.
    listen 80;
    listen [::]:80;
    server_name pay.alexguandaru.dev;

    # Don't advertise the Nginx version in errors and headers
    server_tokens off;

    root /var/www/mpesa-pay;
    index index.html;

    # ---------- API ----------

    # Everything else under /api/: Safaricom's callback and the page's status polling
    # (one request every 2 s while waiting, so no rate limit here). Daraja's callback
    # body is a few hundred bytes.
    location /api/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy-to-api.conf;
    }

    # 3 per minute, plus a burst of 2 so someone can cancel and retry a couple of times
    # straight away. Over the limit, Nginx answers 429 without bothering Spring.
    location = /api/payments/stk-push {
        limit_req zone=stkpush burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy-to-api.conf;
    }

    # ---------- The payment page ----------

    # Vite puts a content hash in every file name under /assets (index-CbhaB2Ym.js), so a
    # changed file always gets a new name. Browsers may keep these for a year.
    location /assets/ {
        include /etc/nginx/snippets/pay-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is never cached, so a new deploy shows up on the next page load.
    location / {
        include /etc/nginx/snippets/pay-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
