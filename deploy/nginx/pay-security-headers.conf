# Security headers for the payment page. On the server: /etc/nginx/snippets/
#
# Why a snippet, included in every location, instead of add_header once in the server block?
# Nginx gotcha: a location with ANY add_header of its own drops every add_header from the
# server block. Both page locations add Cache-Control, so they include these explicitly.

# Don't let other sites show the payment form inside a frame (blocks clickjacking)
add_header X-Frame-Options "DENY" always;
# Don't let the browser guess file types (a "text file" can't suddenly run as script)
add_header X-Content-Type-Options "nosniff" always;
# Send only the domain, not full URLs, when following a link to another site
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# It's a sandbox test page: keep it out of search results
add_header X-Robots-Tag "noindex, nofollow" always;
