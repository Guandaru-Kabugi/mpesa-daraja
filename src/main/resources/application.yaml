spring:
  application:
    name: mpesa
mpesa:
  daraja:
    base-url: https://sandbox.safaricom.co.ke
    # Where Safaricom POSTs the payment result. It must be public HTTPS, so while developing
    # set PUBLIC_BASE_URL to your ngrok address (e.g. https://ab12-cd34.ngrok-free.app).
    stk-push-callback-url: ${PUBLIC_BASE_URL:https://alexguandaru.dev}/api/payments/callback
    consumer-key: ${CONSUMER_KEY}
    consumer-secret: ${CONSUMER_SECRET}
    passkey: ${PASSKEY}
    business-shortcode: ${BUSINESS_SHORTCODE}
server:
  port: 8082
